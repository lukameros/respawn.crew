<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Velká díra 1 — Loading</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#030304;color:#eee;font-family:'Courier New',monospace;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,rgba(120,0,0,.35),transparent 45%),linear-gradient(180deg,#09090b,#020203);z-index:0}
.wrap{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.box{width:min(740px,92vw);background:rgba(6,6,8,.88);border:2px solid #8a0000;box-shadow:0 0 42px #000;padding:28px;border-radius:12px}
h1{margin:0 0 8px;font-size:34px;letter-spacing:3px;color:#ffd6d6;text-shadow:2px 2px #000}
.sub{color:#999;font-size:13px;margin-bottom:22px}
.track{height:18px;background:#150000;border:1px solid #740000;box-shadow:inset 0 0 10px #000;border-radius:10px;overflow:hidden}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#720000,#ffbd54);box-shadow:0 0 16px rgba(255,180,60,.5);transition:width .12s}
#pct{margin-top:12px;color:#ffd27a;font-weight:bold}
#file{margin-top:8px;color:#777;font-size:11px;min-height:16px;word-break:break-all}
button{margin-top:18px;background:#260000;color:#ffd0d0;border:1px solid #a00000;padding:10px 18px;font:bold 14px 'Courier New',monospace;cursor:pointer;display:none;letter-spacing:1px}
button:hover{background:#520000}
.warn{margin-top:18px;color:#666;font-size:11px;line-height:1.4}
</style>
</head>
<body>
<div class="wrap"><div class="box">
<h1>VELKÁ DÍRA 1</h1>
<div class="sub" id="status">Načítám hru...</div>
<div class="track"><div class="fill" id="fill"></div></div>
<div id="pct">0%</div>
<div id="file">start</div>
<button id="playBtn" onclick="go()">HRÁT</button>
<div class="warn">Po načtení klikni na HRÁT.</div>
</div></div>
<script>
const FILES=["ammo_crate.png", "armored_enemy.png", "awp_hold.png", "bench_lavice.png", "blood_splat.png", "char_editor_v2.html", "char_editor_v2_real.html", "char_editor_v2_real.html.js", "hudba.mp3", "index.html", "loading.html", "lobby.html", "lobby_crate.png", "lobby_map.png", "m4_hold.png", "m60_hold.png", "mapa.png", "menu.html", "menu_bg.png", "real_mapa.html", "real_mapa.html.js", "skeleton_editor.html", "strelba3.mp3", "sw.js", "version.json"];
const CURRENT_CACHE='velka-dira-current';
const UPDATE_CACHE='velka-dira-v58-update';
const VERSION='v58';
const BASE='./';
const fill=document.getElementById('fill'), pct=document.getElementById('pct'), fileEl=document.getElementById('file'), playBtn=document.getElementById('playBtn'), statusEl=document.getElementById('status');
let total=0,done=0,shown=false;
function urlOf(f){return BASE+String(f).replace(/^\.\//,'');}
function setBar(p,name){fill.style.width=p+'%';pct.textContent=p+'%';if(name)fileEl.textContent=name;}
function step(name){done++;const p=total?Math.min(100,Math.round(done/total*100)):100;setBar(p,name||'hotovo');}
function showPlay(text){if(text)statusEl.textContent=text;playBtn.style.display='inline-block';shown=true;}
function go(){location.href=urlOf('menu.html');}
setTimeout(()=>{if(!shown){setBar(100,'připraveno');showPlay('Připraveno.')}},3500);
async function registerSW(){if(location.protocol==='file:')return;if('serviceWorker' in navigator){try{await navigator.serviceWorker.register(urlOf('sw.js'),{scope:'./'});}catch(e){}}}
async function manifest(){try{const r=await fetch(urlOf('version.json')+'?v='+Date.now(),{cache:'no-store'});if(r.ok)return await r.json();}catch(e){}return {version:VERSION,files:Object.fromEntries(FILES.map(f=>[f,{size:0,sha256:'x'}]))};}
function localManifest(){try{return JSON.parse(localStorage.getItem('MADNESS_VERSION_MANIFEST')||'null')}catch(e){return null}}
function changed(remote,local){const rf=remote.files||{},lf=(local&&local.files)||{};return Object.keys(rf).filter(f=>!lf[f]||lf[f].sha256!==rf[f].sha256||lf[f].size!==rf[f].size);}
async function cacheOne(cache,f){try{const u=urlOf(f);const res=await fetch(u,{cache:'reload'});if(res&&res.ok)await cache.put(u,res.clone());}catch(e){}step(f);}
async function promote(remote){try{await caches.delete(CURRENT_CACHE);const cur=await caches.open(CURRENT_CACHE);const upd=await caches.open(UPDATE_CACHE);const keys=await upd.keys();for(const req of keys){const res=await upd.match(req);if(res)await cur.put(req,res);}await caches.delete(UPDATE_CACHE);localStorage.setItem('MADNESS_VERSION_MANIFEST',JSON.stringify(remote));localStorage.setItem('MADNESS_GAME_VERSION',remote.version||VERSION);}catch(e){}}
async function start(){
  if(location.protocol==='file:'){setBar(100,'připraveno');showPlay('Připraveno.');return;}
  await registerSW();
  const remote=await manifest();
  const todo=changed(remote,localManifest());
  if(!todo.length){setBar(100,'připraveno');showPlay('Připraveno.');return;}
  if(!('caches' in window)){setBar(100,'připraveno');showPlay('Připraveno.');return;}
  total=Math.max(1,todo.length);done=0;statusEl.textContent='Načítám hru...';
  try{await caches.delete(UPDATE_CACHE);const c=await caches.open(UPDATE_CACHE);for(const f of todo)await cacheOne(c,f);await promote(remote);}catch(e){}
  setBar(100,'připraveno');showPlay('Připraveno.');
}
start();
</script>
</body>
</html>
