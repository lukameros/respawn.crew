<script id="v117GlobalAudio">
(function(){
  if(window.__v117AudioInstalled)return; window.__v117AudioInstalled=true;
  const IS_MENU=/\/menu\.html(?:$|\?)/i.test(location.pathname)||/menu\.html/i.test(location.href);
  const IS_LOBBY=/\/lobby\.html(?:$|\?)/i.test(location.pathname)||/lobby\.html/i.test(location.href);
  const IS_MISSION=/\/real_mapa\.html(?:$|\?)/i.test(location.pathname)||/real_mapa\.html/i.test(location.href);
  const VOL=()=>{try{return Math.max(0,Math.min(1,Number(localStorage.getItem('MADNESS_MUSIC_VOL')||50)/100))}catch(e){return .5}};
  const SFX=()=>{try{return Math.max(0,Math.min(1,Number(localStorage.getItem('MADNESS_SFX_VOL')||80)/100))}catch(e){return .8}};
  function make(src,loop,vol){
    const a=new Audio(src);
    a.loop=!!loop; a.preload='auto'; a.volume=vol;
    a.setAttribute('playsinline','');
    return a;
  }
  window.__v117BtnAudio=window.__v117BtnAudio||make('button.mp3',false,.42);
  window.__v117ShotPool=window.__v117ShotPool||[make('strelba3.mp3',false,.65),make('strelba3.mp3',false,.65),make('strelba3.mp3',false,.65)];
  window.__v117ShotIndex=window.__v117ShotIndex||0;
  window.v117PlayButton=function(){
    try{
      const a=window.__v117BtnAudio;
      a.volume=.35*SFX(); a.currentTime=0; a.play().catch(()=>{});
    }catch(e){}
  };
  window.v117PlayShot=function(vol=1){
    if(IS_MENU)return;
    try{
      const pool=window.__v117ShotPool;
      const a=pool[window.__v117ShotIndex++%pool.length];
      a.volume=Math.max(.05,Math.min(1,vol*SFX()));
      a.currentTime=0; a.play().catch(()=>{});
      return true;
    }catch(e){return false}
  };
  window.v117StartPageAudio=function(){
    try{
      if(!window.__v117Music){
        if(IS_MENU) window.__v117Music=make('hudba.mp3',true,.50*VOL());
        else if(IS_LOBBY||IS_MISSION) window.__v117Music=make('rain.mp3',true,.62*VOL());
      }
      if(window.__v117Music){
        window.__v117Music.volume=(IS_MENU?.50:.62)*VOL();
        window.__v117Music.play().catch(()=>{});
      }
    }catch(e){}
  };
  function unlock(){ v117StartPageAudio(); v117PlayButton(); }
  document.addEventListener('pointerdown',unlock,{once:true,capture:true});
  document.addEventListener('keydown',unlock,{once:true,capture:true});
  document.addEventListener('click',function(e){
    const el=e.target&&e.target.closest?e.target.closest('button,a,[onclick],input,select,label'):null;
    if(el)v117PlayButton();
  },true);
  window.addEventListener('load',()=>setTimeout(v117StartPageAudio,180));
})();
</script>
