<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Velká díra 1 — Loading</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#030304;color:#eee;font-family:'Courier New',monospace;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,rgba(120,0,0,.35),transparent 45%),linear-gradient(180deg,#09090b,#020203);z-index:0}
.wrap{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.box{width:min(740px,92vw);background:rgba(6,6,8,.88);border:2px solid #8a0000;box-shadow:0 0 42px #000;padding:28px;border-radius:12px}
h1{margin:0 0 8px;font-size:34px;letter-spacing:3px;color:#ffd6d6;text-shadow:2px 2px #000}
.sub{color:#999;font-size:13px;margin-bottom:22px}
.track{height:18px;background:#150000;border:1px solid #740000;box-shadow:inset 0 0 10px #000;border-radius:10px;overflow:hidden}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#720000,#ffbd54);box-shadow:0 0 16px rgba(255,180,60,.5);transition:width .12s}
#pct{margin-top:12px;color:#ffd27a;font-weight:bold}
#file{margin-top:8px;color:#777;font-size:11px;min-height:16px;word-break:break-all}
button{margin-top:18px;background:#260000;color:#ffd0d0;border:1px solid #a00000;padding:10px 18px;font:bold 14px 'Courier New',monospace;cursor:pointer;display:none;letter-spacing:1px}
button:hover{background:#520000}
.warn{margin-top:18px;color:#666;font-size:11px;line-height:1.4}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:20;align-items:center;justify-content:center;padding:20px}
#modal .m{max-width:540px;background:#08080a;border:2px solid #8a0000;box-shadow:0 0 36px #000;padding:22px;text-align:center;border-radius:10px}
#modal h2{margin:0 0 10px;color:#ffbebe;letter-spacing:2px}
#modal p{color:#aaa;line-height:1.45}
#modal button{display:inline-block}
</style>
</head>
<body>
<div class="wrap"><div class="box">
<h1>VELKÁ DÍRA 1</h1>
<div class="sub" id="status">Kontroluju verzi hry...</div>
<div class="track"><div class="fill" id="fill"></div></div>
<div id="pct">0%</div>
<div id="file">start</div>
<button id="playBtn" onclick="go()">HRÁT</button>
<div class="warn">GitHub Pages režim: když cache nebo update selže, hra se stejně pustí normálně přes soubory na webu.</div>
</div></div>
<div id="modal"><div class="m"><h2 id="modalTitle">HLÁŠENÍ</h2><p id="modalText"></p><button onclick="closeModal()">OK</button></div></div>
<script>
const FALLBACK_FILES=["ammo_crate.png", "armored_enemy.png", "avatars/avatar_1.png", "avatars/avatar_2.png", "avatars/avatar_3.png", "avatars/jesus_lukamer.png", "awp_hold.png", "bench_lavice.png", "blood_splat.png", "char_editor_v2.html", "char_editor_v2_real.html", "char_editor_v2_real.html.js", "hudba.mp3", "index.html", "loading.html", "lobby.html", "lobby_crate.png", "lobby_map.png", "m4_hold.png", "m60_hold.png", "mapa.png", "menu.html", "menu_bg.png", "real_mapa.html", "real_mapa.html.js", "skeleton_editor.html", "strelba3.mp3", "sw.js", "version.json"];
const CURRENT_CACHE='velka-dira-current';
const UPDATE_CACHE='velka-dira-v57-update';
const VERSION='v57';
const BASE='./';
const fill=document.getElementById('fill'), pct=document.getElementById('pct'), fileEl=document.getElementById('file'), playBtn=document.getElementById('playBtn'), statusEl=document.getElementById('status');
let total=0, done=0, playShown=false;
function urlOf(f){return BASE+String(f).replace(/^\.\//,'');}
function setBar(p,name){fill.style.width=p+'%';pct.textContent=p+'%';if(name)fileEl.textContent=name;}
function step(name){done++;const p=total?Math.min(100,Math.round(done/total*100)):100;setBar(p,name||'hotovo');}
function showPlay(text){if(text)statusEl.textContent=text;playBtn.style.display='inline-block';playShown=true;}
function go(){location.href=urlOf('menu.html');}
function showModal(title,text){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=text;document.getElementById('modal').style.display='flex';}
function closeModal(){document.getElementById('modal').style.display='none';}
setTimeout(()=>{if(!playShown)showPlay('Loading trvá dlouho. Můžeš spustit hru přímo.');},4500);
async function registerSW(){
  if(location.protocol==='file:')return;
  if('serviceWorker' in navigator){
    try{await navigator.serviceWorker.register(urlOf('sw.js'),{scope:'./'});}catch(e){console.warn('SW register failed',e);}
  }
}
async function safeHasCache(){
  if(!('caches' in window))return false;
  try{const c=await caches.open(CURRENT_CACHE);return !!(await c.match(urlOf('menu.html')))||!!(await c.match('menu.html'));}catch(e){return false;}
}
async function getRemoteManifest(){
  const r=await fetch(urlOf('version.json')+'?v='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('version.json '+r.status);
  return await r.json();
}
function getLocalManifest(){try{return JSON.parse(localStorage.getItem('MADNESS_VERSION_MANIFEST')||'null')}catch(e){return null}}
function changedFiles(remote,local){
  const rf=remote.files||{}, lf=(local&&local.files)||{};
  return Object.keys(rf).filter(f=>!lf[f]||lf[f].sha256!==rf[f].sha256||lf[f].size!==rf[f].size);
}
async function cacheOne(cache,f){
  const u=urlOf(f);
  try{
    const res=await fetch(u,{cache:'reload'});
    if(!res.ok)throw new Error(f+' '+res.status);
    await cache.put(u,res.clone());
    step(f);
    return true;
  }catch(e){
    console.warn('cache skip',f,e);
    step('Přeskočeno: '+f);
    return false;
  }
}
async function promote(remote){
  if(!('caches' in window))return;
  try{
    await caches.delete(CURRENT_CACHE);
    const current=await caches.open(CURRENT_CACHE);
    const update=await caches.open(UPDATE_CACHE);
    const keys=await update.keys();
    for(const req of keys){
      const res=await update.match(req);
      if(res)await current.put(req,res);
    }
    await caches.delete(UPDATE_CACHE);
    localStorage.setItem('MADNESS_VERSION_MANIFEST',JSON.stringify(remote));
    localStorage.setItem('MADNESS_GAME_VERSION',remote.version||VERSION);
  }catch(e){console.warn('promote failed',e);}
}
async function start(){
  if(location.protocol==='file:'){
    setBar(100,'file:// režim');
    showModal('OMEZENÝ REŽIM','Spouštíš přes file://. Na GitHub Pages nebo localhost bude loading fungovat lépe.');
    showPlay('File režim. Spusť bez updateru.');
    return;
  }
  await registerSW();
  if(!navigator.onLine){
    setBar(100,'offline');
    showModal('OFFLINE','Jsi offline. Používáš starou/offline verzi, pokud je uložená.');
    showPlay('Offline režim.');
    return;
  }
  let remote=null;
  try{
    statusEl.textContent='Kontroluju version.json...';
    remote=await getRemoteManifest();
  }catch(e){
    console.warn(e);
    setBar(100,'version.json nejde načíst');
    showModal('VERSION.JSON NENAČTEN','Nepodařilo se načíst version.json. Hru ale můžeš spustit přímo z GitHub Pages.');
    showPlay('Updater přeskočen. Můžeš hrát.');
    return;
  }
  const local=getLocalManifest();
  const todo=changedFiles(remote,local);
  if(!todo.length){
    setBar(100,'Verze aktuální: '+(remote.version||VERSION));
    showPlay('Verze hry je aktuální.');
    return;
  }
  if(!('caches' in window)){
    setBar(100,'Cache API není dostupné');
    showPlay('Cache není dostupná. Hra poběží přímo z webu.');
    return;
  }
  statusEl.textContent=local?'Nová verze. Stahuju změny...':'První stažení cache...';
  total=Math.max(1,todo.length);done=0;
  try{await caches.delete(UPDATE_CACHE);}catch(e){}
  let okCount=0, failCount=0;
  try{
    const update=await caches.open(UPDATE_CACHE);
    for(const f of todo){if(await cacheOne(update,f))okCount++;else failCount++;}
    if(okCount>0)await promote(remote);
    setBar(100,failCount?('Hotovo s přeskočenými soubory: '+failCount):('Verze '+(remote.version||VERSION)+' připravena'));
    if(failCount)showModal('CACHE NEÚPLNÁ','Některé soubory nešly uložit do cache, ale na GitHub Pages se hra i tak spustí normálně.');
    showPlay(failCount?'Cache částečná. Můžeš hrát.':'Hotovo. Můžeš hrát.');
  }catch(e){
    console.warn('update failed',e);
    setBar(100,'cache update selhal');
    showModal('CACHE SELHALA','Cache/update selhal. Hru ale spustím přímo přes GitHub Pages.');
    showPlay('Update přeskočen. Můžeš hrát.');
  }
}
start();
</script>
</body>
</html>
