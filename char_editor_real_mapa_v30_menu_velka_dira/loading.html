<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Velká díra 1 — Loading</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#030304;color:#eee;font-family:'Courier New',monospace;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,rgba(120,0,0,.35),transparent 45%),linear-gradient(180deg,#09090b,#020203);z-index:0}
.wrap{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.box{width:min(740px,92vw);background:rgba(6,6,8,.88);border:2px solid #8a0000;box-shadow:0 0 42px #000;padding:28px;border-radius:12px}
h1{margin:0 0 8px;font-size:34px;letter-spacing:3px;color:#ffd6d6;text-shadow:2px 2px #000}
.sub{color:#999;font-size:13px;margin-bottom:22px}
.track{height:18px;background:#150000;border:1px solid #740000;box-shadow:inset 0 0 10px #000;border-radius:10px;overflow:hidden}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#720000,#ffbd54);box-shadow:0 0 16px rgba(255,180,60,.5);transition:width .12s}
#pct{margin-top:12px;color:#ffd27a;font-weight:bold}
#file{margin-top:8px;color:#777;font-size:11px;min-height:16px;word-break:break-all}
.warn{margin-top:18px;color:#666;font-size:11px;line-height:1.4}
button{margin-top:18px;background:#260000;color:#ffd0d0;border:1px solid #a00000;padding:10px 18px;font:bold 14px 'Courier New',monospace;cursor:pointer;display:none;letter-spacing:1px}
button:hover{background:#520000}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:20;align-items:center;justify-content:center;padding:20px}
#modal .m{max-width:520px;background:#08080a;border:2px solid #8a0000;box-shadow:0 0 36px #000;padding:22px;text-align:center;border-radius:10px}
#modal h2{margin:0 0 10px;color:#ffbebe;letter-spacing:2px}
#modal p{color:#aaa;line-height:1.45}
#modal button{display:inline-block}
</style>
</head>
<body>
<div class="wrap"><div class="box">
<h1>VELKÁ DÍRA 1</h1>
<div class="sub" id="status">Kontroluju verzi hry...</div>
<div class="track"><div class="fill" id="fill"></div></div>
<div id="pct">0%</div>
<div id="file">start</div>
<button id="playBtn" onclick="go()">HRÁT</button>
<div class="warn">Když je dostupná nová verze, loading stáhne jen nové nebo změněné soubory. Když update selže, můžeš hrát starou offline verzi.</div>
</div></div>
<div id="modal"><div class="m"><h2 id="modalTitle">STARÁ VERZE</h2><p id="modalText"></p><button onclick="closeModal()">OK</button></div></div>
<script>
const FALLBACK_FILES=["ammo_crate.png", "armored_enemy.png", "avatars/avatar_1.png", "avatars/avatar_2.png", "avatars/avatar_3.png", "avatars/jesus_lukamer.png", "awp_hold.png", "bench_lavice.png", "blood_splat.png", "char_editor_v2.html", "char_editor_v2_real.html", "char_editor_v2_real.html.js", "hudba.mp3", "index.html", "loading.html", "lobby.html", "lobby_crate.png", "lobby_map.png", "m4_hold.png", "m60_hold.png", "mapa.png", "menu.html", "menu_bg.png", "real_mapa.html", "real_mapa.html.js", "skeleton_editor.html", "strelba3.mp3", "sw.js", "version.json"];
const CURRENT_CACHE='velka-dira-current';
const UPDATE_CACHE='velka-dira-v47-update';
const VERSION='v47';
const fill=document.getElementById('fill'), pct=document.getElementById('pct'), fileEl=document.getElementById('file'), playBtn=document.getElementById('playBtn'), statusEl=document.getElementById('status');
let total=0, done=0;
function setProgress(name){
  done++;
  const p=total?Math.round(done/total*100):100;
  fill.style.width=p+'%'; pct.textContent=p+'%'; fileEl.textContent=name||'hotovo';
}
function showPlay(text){
  if(text)statusEl.textContent=text;
  playBtn.style.display='inline-block';
}
function go(){location.href='menu.html'}
function showModal(title,text){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalText').textContent=text;
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none'}
async function registerSW(){
  if(location.protocol==='file:')return;
  if('serviceWorker' in navigator){
    try{await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;}catch(e){}
  }
}
async function cacheHasMenu(cacheName){
  try{const c=await caches.open(cacheName);return !!(await c.match('menu.html'));}catch(e){return false}
}
async function hasPlayableCache(){
  if(!('caches' in window))return false;
  if(await cacheHasMenu(CURRENT_CACHE))return true;
  const names=await caches.keys();
  for(const n of names){if(n.indexOf('velka-dira-')===0 && await cacheHasMenu(n))return true;}
  return false;
}
async function getRemoteManifest(){
  const r=await fetch('version.json?v='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('version.json');
  return await r.json();
}
function getLocalManifest(){
  try{return JSON.parse(localStorage.getItem('MADNESS_VERSION_MANIFEST')||'null')}catch(e){return null}
}
function changedFiles(remote,local){
  const rf=remote.files||{}, lf=(local&&local.files)||{};
  return Object.keys(rf).filter(f=>!lf[f]||lf[f].sha256!==rf[f].sha256||lf[f].size!==rf[f].size);
}
async function cacheOne(cache,url){
  const res=await fetch(url,{cache:'reload'});
  if(!res.ok)throw new Error(url);
  await cache.put(url,res.clone());
  setProgress(url);
}
async function promoteUpdateCache(remote){
  await caches.delete(CURRENT_CACHE);
  const current=await caches.open(CURRENT_CACHE);
  const update=await caches.open(UPDATE_CACHE);
  const keys=await update.keys();
  for(const req of keys){
    const res=await update.match(req);
    if(res)await current.put(req,res);
  }
  await caches.delete(UPDATE_CACHE);
  localStorage.setItem('MADNESS_VERSION_MANIFEST',JSON.stringify(remote));
  localStorage.setItem('MADNESS_GAME_VERSION',remote.version||VERSION);
}
async function playOld(reason){
  fill.style.width='100%';pct.textContent='100%';
  fileEl.textContent='starší offline verze';
  showModal('POUŽÍVÁŠ STAROU VERZI',reason+' Spustím uloženou offline verzi hry.');
  showPlay('Update nejde stáhnout. Můžeš hrát starší offline verzi.');
}
async function waitOnlineFirstInstall(){
  statusEl.textContent='Jsi offline a hra ještě není stažená. Čekám na internet pro první stažení...';
  fileEl.textContent='offline';
  await new Promise(resolve=>addEventListener('online',resolve,{once:true}));
}
async function start(){
  if(location.protocol==='file:'){
    fill.style.width='100%';pct.textContent='100%';
    fileEl.textContent='file:// režim';
    showModal('OMEZENÝ REŽIM','Spouštíš hru přes file://. Online/cache updater nemusí fungovat. Použij GitHub Pages nebo localhost.');
    showPlay('Spouštím bez updateru.');
    return;
  }
  await registerSW();
  const playable=await hasPlayableCache();
  if(!navigator.onLine){
    if(playable){await playOld('Jsi offline, takže nejde zkontrolovat nebo stáhnout nová verze.');return;}
    await waitOnlineFirstInstall();
  }
  let remote;
  try{
    statusEl.textContent='Kontroluju verzi hry...';
    remote=await getRemoteManifest();
  }catch(e){
    if(await hasPlayableCache()){await playOld('Nepodařilo se zkontrolovat verzi hry.');return;}
    remote={version:VERSION,files:Object.fromEntries(FALLBACK_FILES.map(f=>[f,{sha256:'fallback'}]))};
  }
  const local=getLocalManifest();
  const todo=changedFiles(remote,local);
  total=Math.max(1,todo.length);
  if(!todo.length){
    fill.style.width='100%';pct.textContent='100%';fileEl.textContent='Verze aktuální: '+(remote.version||VERSION);
    showPlay('Verze hry je aktuální.');
    return;
  }
  statusEl.textContent=local?'Nová verze nalezena. Stahuju změněné soubory...':'První stažení celé hry...';
  await caches.delete(UPDATE_CACHE);
  const update=await caches.open(UPDATE_CACHE);
  try{
    for(const f of todo)await cacheOne(update,f);
    await promoteUpdateCache(remote);
    fill.style.width='100%';pct.textContent='100%';
    fileEl.textContent='Verze '+(remote.version||VERSION)+' připravena';
    showPlay('Hotovo. Nová verze je připravená.');
  }catch(e){
    await caches.delete(UPDATE_CACHE);
    if(await hasPlayableCache()){await playOld('Nová verze existuje, ale některé soubory nešly stáhnout.');return;}
    statusEl.textContent='Stažení selhalo a stará verze není v cache.';
    fileEl.textContent='zkus obnovit stránku';
    showModal('STAŽENÍ SELHALO','Hra ještě není uložená offline. Připoj internet a obnov loading.');
  }
}
start();
</script>
</body>
</html>
