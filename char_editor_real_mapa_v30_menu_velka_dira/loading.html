<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Velká díra 1 — Loading</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020203;color:#eee;font-family:'Courier New',monospace;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,rgba(120,0,0,.34),transparent 42%),linear-gradient(180deg,#09090b,#020203);z-index:0}
.wrap{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.box{width:min(740px,92vw);background:rgba(6,6,8,.88);border:2px solid #8a0000;box-shadow:0 0 42px #000;padding:30px;border-radius:12px}
h1{margin:0 0 10px;font-size:34px;letter-spacing:3px;color:#ffd6d6;text-shadow:2px 2px #000}
.sub{color:#999;font-size:13px;margin-bottom:22px}
.track{height:18px;background:#150000;border:1px solid #740000;box-shadow:inset 0 0 10px #000;border-radius:10px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#720000,#ffbd54);box-shadow:0 0 16px rgba(255,180,60,.5);transition:width .12s linear}
#pct{margin-top:12px;color:#ffd27a;font-weight:bold}
#file{margin-top:8px;color:#777;font-size:11px;min-height:16px;word-break:break-all}
</style>
</head>
<body>
<div class="wrap"><div class="box">
<h1>VELKÁ DÍRA 1</h1>
<div class="sub">Načítání...</div>
<div class="track"><div class="fill" id="fill"></div></div>
<div id="pct">0%</div>
<div id="file">start</div>
</div></div>
<script>
const fill=document.getElementById('fill');
const pct=document.getElementById('pct');
const file=document.getElementById('file');
const steps=['mapa','hráč','NPC','zbraně','animace','mise','menu'];
let p=0,i=0;
function tick(){
  p=Math.min(100,p+Math.floor(8+Math.random()*13));
  fill.style.width=p+'%';
  pct.textContent=p+'%';
  file.textContent=steps[Math.min(steps.length-1,i++)]||'hotovo';
  if(p>=100){
    file.textContent='hotovo';
    setTimeout(()=>{location.replace('./menu.html'+(location.search||''));},260);
  }else{
    setTimeout(tick,90);
  }
}
setTimeout(tick,120);
</script>
</body>
</html>
