  box.innerHTML='';

<script id="v133GlobalAudio">
(function(){
  if(window.__v133AudioInstalled)return; window.__v133AudioInstalled=true;

  const VOL=()=>{try{return Math.max(0,Math.min(1,Number(localStorage.getItem('MADNESS_MUSIC_VOL')||50)/100))}catch(e){return .5}};
  const SFX=()=>{try{return Math.max(0,Math.min(1,Number(localStorage.getItem('MADNESS_SFX_VOL')||90)/100))}catch(e){return .9}};
  const MUSIC_FILES=['hudba.mp3','udba.mp3'];
  const RAIN_FILES=['rain.mp3'];
  const SHOT_FILES=['strelba3.mp3','strebla3.mp3'];
  const BTN_FILES=['button.mp3'];
  function makeTry(files,loop,vol){
    let idx=0,a=null;
    function build(){
      const src=files[Math.min(idx,files.length-1)];
      a=new Audio(src);
      a.loop=!!loop; a.preload='auto'; a.volume=vol;
      a.setAttribute('playsinline','');
      a.addEventListener('error',()=>{ if(idx<files.length-1){idx++; build(); if(window.__v133WantMusic&&loop) play();} },{once:true});
      return a;
    }
    function play(){
      try{
        if(!a)build();
        a.volume=vol;
        const pr=a.play();
        if(pr&&pr.catch)pr.catch(()=>{ if(idx<files.length-1){idx++; build(); play();} });
      }catch(e){}
      return a;
    }
    build();
    return {get audio(){return a}, play, setVolume(v){vol=v;if(a)a.volume=v}, pause(){try{if(a)a.pause()}catch(e){}}};
  }
  window.__v133ShotIndex=window.__v133ShotIndex||0;
  window.v133PlayButton=function(){
    try{ if(!window.__v133Btn)window.__v133Btn=makeTry(BTN_FILES,false,.42); window.__v133Btn.setVolume(.38*SFX()); window.__v133Btn.play(); }catch(e){}
  };
  window.v133DuckRain=function(){
    try{
      const m=window.__v133Music&&window.__v133Music.audio;
      if(!m || IS_MENU)return;
      const target=.62*VOL();
      m.volume=Math.max(.08,target*.25);
      clearTimeout(window.__v133RainDuckTimer);
      window.__v133RainDuckTimer=setTimeout(()=>{try{m.volume=target}catch(e){}},220);
    }catch(e){}
  };
  function fallbackShot(vol){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      const ac=window.__madnessAudioCtx||(window.__madnessAudioCtx=new AC());
      if(ac.state==='suspended')ac.resume();
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='square';o.frequency.value=85+Math.random()*60;
      g.gain.value=.0001;o.connect(g);g.connect(ac.destination);
      const t=ac.currentTime;
      g.gain.exponentialRampToValueAtTime(.11*(vol||1)*SFX(),t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+.11);
      o.start(t);o.stop(t+.12);
    }catch(e){}
  }
  window.v133PlayShot=function(vol=1){
    if(IS_MENU)return false;
    try{
      v133DuckRain();
      const src=SHOT_FILES[(window.__v133ShotIndex++)%SHOT_FILES.length];
      const a=new Audio(src);
      a.preload='auto';
      a.volume=Math.max(.35,Math.min(1,vol*1.65*SFX()));
      a.setAttribute('playsinline','');
      a.onerror=()=>fallbackShot(vol);
      const pr=a.play();
      if(pr&&pr.catch)pr.catch(()=>fallbackShot(vol));
      return true;
    }catch(e){fallbackShot(vol);return true}
  };
  window.v133StartPageAudio=function(){
    try{
      window.__v133WantMusic=true;
      if(!window.__v133Music){
        if(IS_MENU) window.__v133Music=makeTry(MUSIC_FILES,true,.55*VOL());
        else if(IS_LOBBY||IS_MISSION) window.__v133Music=makeTry(RAIN_FILES,true,.62*VOL());
      }
      if(window.__v133Music){
        window.__v133Music.setVolume((IS_MENU?.55:.62)*VOL());
        window.__v133Music.play();
      }
    }catch(e){}
  };
  function unlock(){ v133StartPageAudio(); v133PlayButton(); }
  document.addEventListener('pointerdown',unlock,{once:true,capture:true});
  document.addEventListener('keydown',unlock,{once:true,capture:true});
  document.addEventListener('click',function(e){
    const el=e.target&&e.target.closest?e.target.closest('button,a,[onclick],input,select,label'):null;
    if(el){ v133PlayButton(); v133StartPageAudio(); }
  },true);
  window.addEventListener('load',()=>setTimeout(v133StartPageAudio,260));
})();
</script>
